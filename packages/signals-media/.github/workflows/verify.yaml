# Inert inside the Presence monorepo — only the repository-root .github/
# workflows run there. This is the standalone repo's CI once the directory is
# extracted to github.com/lightningrodlabs/signals-media.
name: verify

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop -c npm ci
      - run: nix develop -c npm run typecheck
      - run: nix develop -c npm run test
      - run: nix develop -c npm run build
